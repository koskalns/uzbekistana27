name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare static website
        run: |
          mkdir -p dist/assets
          cp index.html dist/
          cp -R assets/css assets/js assets/vendor assets/maps dist/assets/
          mkdir -p dist/assets/images
          cp assets/images/*.webp assets/images/*.jpg assets/images/*.svg assets/images/*.json assets/images/*.md dist/assets/images/
          cp assets/favicon.svg dist/assets/
          touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
